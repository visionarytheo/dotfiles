# ------------------------------------------------------------------------------
# Basic Settings & True Color Support
# ------------------------------------------------------------------------------
# Enable 24-bit true color support (essential for Neovim themes)
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'

# Enable mouse support
set -g mouse on

# Start window and pane indexing at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Set prefix key to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Faster command delay
set -s escape-time 0

# ------------------------------------------------------------------------------
# Keybindings (Vim-style)
# ------------------------------------------------------------------------------
# Split panes using | and - (opens in current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config quickly with Ctrl+Space + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ------------------------------------------------------------------------------
# Theme Customization (Catppuccin Mocha)
# ------------------------------------------------------------------------------
# Status bar colors (Crust background, Text foreground)
set -g status-style "bg=#11111b,fg=#cdd6f4"

# Left status bar (Session name - Mauve accent)
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[bg=#11111b] "
set -g status-left-length 30

# Window tabs
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#11111b,bg=#b4bfe2,bold] #I:#W #[bg=#11111b]"

# Right status bar (Time & Date - Sapphire & Lavender)
set -g status-right "#[fg=#74c7ec]%Y-%m-%d #[fg=#b4bfe2]%H:%M "

# Active/Inactive pane borders (Surface0 / Mauve)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
