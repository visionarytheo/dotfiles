# ------------------------------------------------------------------------------
# Basic Settings & True Color Support
# ------------------------------------------------------------------------------
# Enable 24-bit true color support (essential for Neovim themes)
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',*:Setulc=\E[58\:2\:\:%p1%{65536}%/%d\:%p1%{256}%/%{255}%&%d\:%p1%{255}%&%d%;m' # Undercurl support
set -as terminal-overrides ',xterm-256color:Tc,ghostty:Tc,foot:Tc' # True color overrides

# Enable mouse support
set -g mouse on

# Start window and pane indexing at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Set prefix key to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Faster command delay
set -s escape-time 0

# ------------------------------------------------------------------------------
# Keybindings (Vim-style)
# ------------------------------------------------------------------------------
# Split panes using | and - (opens in current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config quickly with Ctrl+Space + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ------------------------------------------------------------------------------
# Theme Customization (Tokyo Night - Night)
# ------------------------------------------------------------------------------
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
# Move status bar to the top of the terminal
set -g status-position top

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[bg=#1a1b26] "
set -g status-left-length 30

set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#15161e,bg=#bb9af7,bold] #I:#W #[bg=#1a1b26]"

set -g status-right "#[fg=#7dcfff]%Y-%m-%d #[fg=#2ac3de]%H:%M "

set -g pane-border-style "fg=#27273a"
set -g pane-active-border-style "fg=#bb9af7"

